# Rolling "latest" release publisher.
#
# CI artifacts are *outer* Actions zips that each contain the *inner* AnyKernel3
# installer zip. This workflow downloads the artifact of a chosen CI run,
# extracts the inner installer zip, and uploads it to the GitHub release tagged
# `latest` under stable asset names (direct download URLs never change):
#
#   Sixfaced-miatoll-KSU.zip   <- KernelSU (backslashxx) build
#                                 default source branch: arena/0fc62de9-kernel
#   Sixfaced-miatoll-KSUN.zip  <- KernelSU-Next build
#                                 default source branch: arena/cd1940a2-kernel
#
# Usage: Actions tab -> "Publish latest release" -> Run workflow.
# Leave the run-id inputs empty to auto-pick the newest successful CI run on
# each branch that still has a live (unexpired) artifact. Artifacts are kept
# for 30 days by the CI workflow, so refresh the release at least that often
# or pin explicit run ids.

name: Publish latest release

on:
  # Self-registering trigger: this workflow lives only on non-default branches,
  # and GitHub does not expose such a workflow for workflow_dispatch until it
  # has run at least once. Pushing a change to THIS file triggers a publish,
  # which both registers the workflow and refreshes the release. Kernel CI is
  # NOT re-run for workflow-only pushes (build-kernel.yml has paths-ignore).
  push:
    branches-ignore:
      - build-logs
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      ksu_run:
        description: "CI run id for the KSU build (empty = newest successful on ksu_branch)"
        required: false
        default: ""
      ksun_run:
        description: "CI run id for the KSUN build (empty = newest successful on ksun_branch)"
        required: false
        default: ""
      ksu_branch:
        description: "Branch the KSU artifact comes from"
        required: false
        default: "arena/0fc62de9-kernel"
      ksun_branch:
        description: "Branch the KSUN artifact comes from"
        required: false
        default: "arena/cd1940a2-kernel"
      ksu_artifact:
        description: "Artifact name of the KSU build"
        required: false
        default: "Sixfaced-KSU-miatoll"
      ksun_artifact:
        description: "Artifact name of the KSUN build"
        required: false
        default: "Sixfaced-KSUN-miatoll"

permissions:
  contents: write
  actions: read

concurrency:
  group: sixfaced-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve source CI runs
    runs-on: ubuntu-latest
    outputs:
      ksu_run: ${{ steps.resolve.outputs.ksu_run }}
      ksun_run: ${{ steps.resolve.outputs.ksun_run }}
      ksu_aid: ${{ steps.resolve.outputs.ksu_aid }}
      ksun_aid: ${{ steps.resolve.outputs.ksun_aid }}
      ksu_meta: ${{ steps.meta.outputs.ksu }}
      ksun_meta: ${{ steps.meta.outputs.ksun }}
    steps:
      - name: Resolve run ids
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find_run() { # $1=branch $2=artifact-name -> "run_id artifact_id" of newest successful run with a live artifact
            local branch="${1//\//%2F}" artifact="$2" rid aid
            for rid in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&status=success&per_page=15" \
                         --jq '.workflow_runs[].id'); do
              aid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts" \
                    --jq "[.artifacts[] | select(.name==\"$artifact\" and .expired==false)][0].id // empty")
              if [ -n "$aid" ]; then echo "$rid $aid"; return 0; fi
            done
            return 1
          }
          # github.event.inputs is null on push events -> every parameter
          # falls back to its documented default via `||`.
          KSU_RUN="${{ github.event.inputs.ksu_run || '' }}"
          KSUN_RUN="${{ github.event.inputs.ksun_run || '' }}"
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'arena/0fc62de9-kernel' }}"
          KSUN_BRANCH="${{ github.event.inputs.ksun_branch || 'arena/cd1940a2-kernel' }}"
          KSU_ARTIFACT="${{ github.event.inputs.ksu_artifact || 'Sixfaced-KSU-miatoll' }}"
          KSUN_ARTIFACT="${{ github.event.inputs.ksun_artifact || 'Sixfaced-KSUN-miatoll' }}"
          KSU_AID=""
          KSUN_AID=""
          if [ -n "$KSU_RUN" ]; then
            KSU_AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KSU_RUN/artifacts" \
                      --jq "[.artifacts[] | select(.name==\"$KSU_ARTIFACT\" and .expired==false)][0].id // empty")
            [ -n "$KSU_AID" ] || { echo "::error::pinned run $KSU_RUN has no live '$KSU_ARTIFACT' artifact"; exit 1; }
          else
            read -r KSU_RUN KSU_AID <<<"$(find_run "$KSU_BRANCH" "$KSU_ARTIFACT" || true)"
            if [ -z "$KSU_RUN" ] || [ -z "$KSU_AID" ]; then
              echo "::error::no successful run with a live '$KSU_ARTIFACT' artifact on $KSU_BRANCH"; exit 1
            fi
          fi
          if [ -n "$KSUN_RUN" ]; then
            KSUN_AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KSUN_RUN/artifacts" \
                       --jq "[.artifacts[] | select(.name==\"$KSUN_ARTIFACT\" and .expired==false)][0].id // empty")
            [ -n "$KSUN_AID" ] || { echo "::error::pinned run $KSUN_RUN has no live '$KSUN_ARTIFACT' artifact"; exit 1; }
          else
            read -r KSUN_RUN KSUN_AID <<<"$(find_run "$KSUN_BRANCH" "$KSUN_ARTIFACT" || true)"
            if [ -z "$KSUN_RUN" ] || [ -z "$KSUN_AID" ]; then
              echo "::error::no successful run with a live '$KSUN_ARTIFACT' artifact on $KSUN_BRANCH"; exit 1
            fi
          fi
          echo "ksu_run=$KSU_RUN"   >> "$GITHUB_OUTPUT"
          echo "ksun_run=$KSUN_RUN" >> "$GITHUB_OUTPUT"
          echo "ksu_aid=$KSU_AID"   >> "$GITHUB_OUTPUT"
          echo "ksun_aid=$KSUN_AID" >> "$GITHUB_OUTPUT"
          echo "KSU  build <- CI run $KSU_RUN (artifact id $KSU_AID)"
          echo "KSUN build <- CI run $KSUN_RUN (artifact id $KSUN_AID)"

      - name: Collect run metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          line() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" --jq \
              '"run [#\(.id)](\(.html_url)) | branch `\(.head_branch)` | commit `\(.head_sha[0:9])` | \(.display_title) | built \(.created_at)"'
          }
          { echo 'ksu<<EOF';  line "${{ steps.resolve.outputs.ksu_run }}";  echo 'EOF'; } >> "$GITHUB_OUTPUT"
          { echo 'ksun<<EOF'; line "${{ steps.resolve.outputs.ksun_run }}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release assets
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Download outer artifact zips via REST and unzip them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KSU_AID: ${{ needs.resolve.outputs.ksu_aid }}
          KSUN_AID: ${{ needs.resolve.outputs.ksun_aid }}
        run: |
          set -euo pipefail
          # actions/download-artifact@v4's cross-run `run-id` mode reports
          # "Artifact not found" for other-workflow runs, so we stream the
          # artifact zips straight from the REST API instead.
          mkdir -p ksu ksun
          echo "downloading KSU outer zip (artifact id $KSU_AID)..."
          gh api "repos/$REPO/actions/artifacts/$KSU_AID/zip" > ksu_outer.zip
          echo "downloading KSUN outer zip (artifact id $KSUN_AID)..."
          gh api "repos/$REPO/actions/artifacts/$KSUN_AID/zip" > ksun_outer.zip
          ls -l ksu_outer.zip ksun_outer.zip
          unzip -o ksu_outer.zip  -d ksu
          unzip -o ksun_outer.zip -d ksun
          echo "--- extracted contents ---"
          find ksu ksun -type f | xargs -r ls -l

      - name: Extract inner installer zips
        run: |
          set -euo pipefail
          mkdir -p assets
          pick() { # $1=variant dir, $2=stable asset name
            local inner
            inner=$(find "$1" -maxdepth 3 -type f -name '*.zip' | head -1)
            if [ -z "$inner" ]; then
              echo "::error::no inner installer zip found under $1/"
              exit 1
            fi
            echo "$1: inner installer zip = $inner ($(stat -c%s "$inner") bytes)"
            cp "$inner" "assets/$2"
          }
          pick ksu  Sixfaced-miatoll-KSU.zip
          pick ksun Sixfaced-miatoll-KSUN.zip
          ls -l assets/

      - name: Create/update the rolling 'latest' release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KSU_META: ${{ needs.resolve.outputs.ksu_meta }}
          KSUN_META: ${{ needs.resolve.outputs.ksun_meta }}
        run: |
          set -euo pipefail
          TAG="latest"
          TITLE="Sixfaced Kernel — latest builds (miatoll)"
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          # NOTE: double-quoted string, NOT a heredoc: the meta values carry
          # markdown backticks, and expansion results are never re-scanned by
          # bash, so they cannot trigger command substitution here.
          NOTES="Rolling release — re-published by the *Publish latest release* workflow on ${STAMP}.

          ## Assets
          | File | Root solution | Source |
          |---|---|---|
          | Sixfaced-miatoll-KSU.zip | KernelSU (backslashxx driver + SuSFS v2.3.0 + NoMount) | ${KSU_META} |
          | Sixfaced-miatoll-KSUN.zip | KernelSU-Next | ${KSUN_META} |

          ## Flashing
          1. Flash the zip for your root solution only (KSU **or** KSUN — never both, and don't stack APatch on top).
          2. Reboot, then install the matching manager app:
             - KSU build → backslashxx KernelSU manager (driver version: see KernelSU/VENDOR-INFO)
             - KSUN build → KernelSU-Next manager
          3. A-only device (miatoll) — no slot handling needed.

          Direct links (stable, always point at the newest publish):
          - https://github.com/${REPO}/releases/download/latest/Sixfaced-miatoll-KSU.zip
          - https://github.com/${REPO}/releases/download/latest/Sixfaced-miatoll-KSUN.zip
          "
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" assets/Sixfaced-miatoll-KSU.zip assets/Sixfaced-miatoll-KSUN.zip \
            --repo "$REPO" --clobber
          echo "--- published ---"
          gh release view "$TAG" --repo "$REPO"
