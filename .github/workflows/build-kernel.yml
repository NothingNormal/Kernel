# Warm-cache verification run: no source changes, ccache should hit ~100%.
name: Sixfaced Kernel CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - build-logs
    # Workflow/doc-only pushes do not rebuild the kernel: they cannot
    # change the resulting image, and toolchain/CI changes are exercised
    # by the next source push or by a manual workflow_dispatch run.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: sixfaced-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Sixfaced (miatoll, arm64, KSU)
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show vendored KernelSU info
        run: |
          cat KernelSU/VENDOR-INFO | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install toolchain and build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm zip ccache pigz zstd bc bison flex libssl-dev libelf-dev lz4 lzop
          echo "--- versions ---"
          clang --version | head -2
          ld.lld --version | head -1

      - name: Compiler cache (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Build kernel
        id: build
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh 2>&1 | tee "${RUNNER_TEMP}/build.log"

      - name: Prepare failure report
        if: failure()
        run: |
          LOG="${RUNNER_TEMP}/build.log"
          [ -f "$LOG" ] || : > "$LOG"
          {
            echo "# Sixfaced CI - FAILED run #${{ github.run_number }}"
            echo
            echo "- run URL : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- ref     : ${{ github.ref }}"
            echo "- commit  : ${{ github.sha }}"
            echo "- date    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- clang   : $(clang --version 2>/dev/null | head -1)"
            echo
            echo "## Extracted errors (last 300 matches)"
            echo '```'
            grep -nE "error:|Error [0-9]+|fatal error|undefined (reference|symbol)|No rule to make target|ld\.lld:|Segmentation" \
              "$LOG" | tail -n 300 || echo "(no pattern matches - see full build.log)"
            echo '```'
            echo
            echo "## Tail of build log (last 250 lines)"
            echo '```'
            tail -n 250 "$LOG"
            echo '```'
          } > "${RUNNER_TEMP}/ERRORS.md"
          cat "${RUNNER_TEMP}/ERRORS.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push logs to build-logs branch
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNDIR="runs/$(date -u +%Y%m%d-%H%M%S)-run${{ github.run_number }}"
          WORK=/tmp/logpush
          rm -rf "$WORK"; git init -q "$WORK"; cd "$WORK"
          git config user.name  "sixfaced-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin build-logs || true
          if git rev-parse -q --verify origin/build-logs >/dev/null; then
            git checkout -q -b build-logs origin/build-logs
          else
            git checkout -q --orphan build-logs
          fi
          mkdir -p "$RUNDIR"
          cp "${RUNNER_TEMP}/build.log" "$RUNDIR/build.log" 2>/dev/null \
            || echo "(no build.log produced)" > "$RUNDIR/build.log"
          cp "${RUNNER_TEMP}/ERRORS.md" "$RUNDIR/ERRORS.md" 2>/dev/null || true
          SZ=$(stat -c%s "$RUNDIR/build.log" 2>/dev/null || echo 0)
          if [ "$SZ" -gt 80000000 ]; then gzip -9f "$RUNDIR/build.log"; fi
          # keep the branch tip slim: last 15 runs (older ones stay in history/artifacts)
          ls -1dt runs/*/ 2>/dev/null | tail -n +16 | xargs -r rm -rf
          git add -A
          git commit -q -m "build-logs: FAILED run #${{ github.run_number }} (${{ github.sha }})" || true
          git push -q origin HEAD:refs/heads/build-logs \
            || echo "::warning::could not push build-logs branch (token permissions?); logs are still in the run artifacts"

      - name: Upload failure logs (artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-run${{ github.run_number }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ERRORS.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload kernel zip (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sixfaced-KSU-miatoll
          path: AnyKernel/Sixfaced-*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Verify Droidspaces options in final .config
        if: success()
        run: |
          MISSING=0
          CRITICAL_MISSING=0
          # Symbols the container feature cannot work without: a silent
          # regression in any of these must not produce a green build.
          CRITICAL="UTS_NS PID_NS IPC_NS NET_NS USER_NS SECCOMP NF_TABLES UCLAMP_TASK SCHED_TUNE"
          for s in SYSCTL SYSVIPC POSIX_MQUEUE PID_NS IPC_NS NET_NS USER_NS UTS_NS \
                   SECCOMP SECCOMP_FILTER CGROUP_DEVICE CGROUP_NET_PRIO CGROUP_PIDS \
                   FAIR_GROUP_SCHED CFS_BANDWIDTH MEMCG MEMCG_SWAP MEMCG_SWAP_ENABLED \
                   DEVTMPFS TMPFS_XATTR TMPFS_POSIX_ACL OVERLAY_FS \
                   FW_LOADER FW_LOADER_USER_HELPER \
                   IPV6 NETFILTER_ADVANCED NF_TABLES NF_TABLES_INET NF_CT_NETLINK \
                   NF_NAT NF_NAT_IPV4 NF_NAT_REDIRECT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE \
                   NETFILTER_XT_MATCH_ADDRTYPE MACVLAN BRIDGE_NETFILTER \
                   NETFILTER_XT_MATCH_OWNER NETFILTER_XT_MATCH_CONNTRACK \
                   IP_NF_TARGET_REJECT IP6_NF_TARGET_REJECT NETFILTER_XT_TARGET_LOG \
                   IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET \
                   NETFILTER_NETLINK_QUEUE NETFILTER_NETLINK_LOG NETFILTER_XT_TARGET_NFLOG \
                   UCLAMP_TASK UCLAMP_TASK_GROUP SCHED_TUNE \
                   PM_AUTOSLEEP WQ_POWER_EFFICIENT_DEFAULT \
                   CPU_FREQ_DEFAULT_GOV_SCHEDUTIL ARM_CPUIDLE DT_IDLE_STATES; do
            if grep -qE "^CONFIG_$s=y" out/.config; then
              echo "OK       CONFIG_$s=y"
            else
              echo "::warning::CONFIG_$s is NOT enabled in the final .config"
              MISSING=$((MISSING+1))
              case " $CRITICAL " in
                *" $s "*) CRITICAL_MISSING=$((CRITICAL_MISSING+1)) ;;
              esac
            fi
          done
          echo "Droidspaces verification: ${MISSING} missing symbol(s), ${CRITICAL_MISSING} of them critical" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$CRITICAL_MISSING" -ne 0 ]; then
            echo "::error::${CRITICAL_MISSING} critical symbol(s) missing from out/.config - the container feature would be silently broken"
            exit 1
          fi

      - name: Update KSU asset on the 'latest' release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP=$(find AnyKernel -maxdepth 1 -name 'Sixfaced-*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "::warning::no kernel zip found under AnyKernel/ - skipping release asset update"
            exit 0
          fi
          cp "$ZIP" Sixfaced-miatoll-KSU.zip
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::release tag 'latest' does not exist - skipping (this workflow never creates releases)"
            exit 0
          fi
          # --clobber replaces ONLY the asset named Sixfaced-miatoll-KSU.zip.
          # The KSUN asset and the release notes are never touched, and no
          # release is ever created here.
          gh release upload latest Sixfaced-miatoll-KSU.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "--- 'latest' release assets after upload ---"
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name): \(.size) bytes, updated \(.updatedAt)"'

